<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#140a25" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseWave1 {
      0%, 100% { transform: scaleY(0.4) translateY(40px); }
      50% { transform: scaleY(1.1) translateY(-10px); }
    }
    @keyframes pulseWave2 {
      0%, 100% { transform: scaleY(1.0) translateY(-5px); }
      50% { transform: scaleY(0.3) translateY(35px); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
    }
    @keyframes barDance {
      0%, 100% { height: 18px; y: 155px; }
      50% { height: 68px; y: 105px; }
    }
    @keyframes shimmerTag {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6)); }
    }
    .wave-bg-1 {
      animation: pulseWave1 6s ease-in-out infinite;
      transform-origin: 50% 300px;
    }
    .wave-bg-2 {
      animation: pulseWave2 8s ease-in-out infinite;
      transform-origin: 50% 300px;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .voice-bar {
      transform-origin: bottom;
      transition: all 0.3s ease;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Background Animated Soundwaves (Kept in Background at lower half) -->
  <g class="wave-bg-2">
    <path d="M0,320 Q200,240 400,290 T800,270 T1200,310 L1200,360 L0,360 Z" fill="url(#waveGrad2)" opacity="0.35" />
  </g>
  <g class="wave-bg-1">
    <path d="M0,335 Q250,270 500,315 T1000,285 T1200,325 L1200,360 L0,360 Z" fill="url(#waveGrad1)" opacity="0.45" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="120" cy="80" r="3" fill="#38bdf8" class="particle" style="animation-delay: 0s;" />
  <circle cx="280" cy="50" r="2" fill="#818cf8" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="950" cy="70" r="3.5" fill="#ec4899" class="particle" style="animation-delay: 2.2s;" />
  <circle cx="1080" cy="110" r="2.5" fill="#a855f7" class="particle" style="animation-delay: 0.8s;" />
  <circle cx="180" cy="220" r="3" fill="#06b6d4" class="particle" style="animation-delay: 3.1s;" />

  <!-- Animated Sound Equalizer Bars (Flanking Background Accents) -->
  <g opacity="0.4" transform="translate(60, 20)">
    <rect x="0" y="140" width="4" height="35" rx="2" fill="#6366f1" style="animation: barDance 1.8s infinite 0.1s ease-in-out;" />
    <rect x="10" y="130" width="4" height="55" rx="2" fill="#8b5cf6" style="animation: barDance 1.4s infinite 0.4s ease-in-out;" />
    <rect x="20" y="145" width="4" height="25" rx="2" fill="#ec4899" style="animation: barDance 2.0s infinite 0.7s ease-in-out;" />
    <rect x="30" y="125" width="4" height="65" rx="2" fill="#38bdf8" style="animation: barDance 1.6s infinite 0.2s ease-in-out;" />
    <rect x="40" y="138" width="4" height="40" rx="2" fill="#6366f1" style="animation: barDance 1.9s infinite 0.5s ease-in-out;" />
  </g>
  <g opacity="0.4" transform="translate(1080, 20)">
    <rect x="0" y="135" width="4" height="45" rx="2" fill="#ec4899" style="animation: barDance 1.7s infinite 0.3s ease-in-out;" />
    <rect x="10" y="125" width="4" height="65" rx="2" fill="#38bdf8" style="animation: barDance 1.5s infinite 0.6s ease-in-out;" />
    <rect x="20" y="140" width="4" height="35" rx="2" fill="#8b5cf6" style="animation: barDance 2.1s infinite 0.1s ease-in-out;" />
    <rect x="30" y="130" width="4" height="55" rx="2" fill="#6366f1" style="animation: barDance 1.8s infinite 0.8s ease-in-out;" />
    <rect x="40" y="142" width="4" height="30" rx="2" fill="#a855f7" style="animation: barDance 1.4s infinite 0.4s ease-in-out;" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Pill -->
  <g transform="translate(600, 52)" style="animation: shimmerTag 4s infinite ease-in-out;">
    <rect x="-175" y="0" width="350" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a5b4fc" letter-spacing="2">🎙️ NEXT-GEN VOICE AI &amp; SPEECH TECH</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <g transform="translate(600, 138)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#glow)">Awesome Speech Synthesis &amp; Voice AI</text>
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#neonGlow)" letter-spacing="-0.5">Awesome Speech Synthesis &amp; Voice AI</text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle / Tagline -->
  <g transform="translate(600, 182)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">
      The Curated Directory of SaaS Platforms &amp; State-of-the-Art Open-Source Audio Repositories
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Feature Badges / Spec Pills -->
  <g transform="translate(600, 230)">
    <!-- Pill 1 -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="75" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ Low-Latency TTS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-165, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="77" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c084fc">🧬 Voice Cloning</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="77" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f472b6">🤖 Conversational AI</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="75" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#34d399">💻 On-Device / Edge</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#neonGlow)" />
</svg>